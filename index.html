<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portfolium">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Portfolium</title>
<meta name="theme-color" content="#0F1A2B">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2.11.1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2.11.1">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2.11.1">
<link rel="manifest" href="manifest.webmanifest?v=2.11.1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Portfolium palette: charcoal #141923 · crimson #C92C32 · off-white #F7F7F8 · slate #6B7280 */
:root{--bg:#F7F7F8;--card:#fff;--ink:#141923;--mut:#6B7280;--line:#E4E6EA;--acc:#2563EB;--ok:#16a34a;--warn:#F59E0B;--bad:#DC2626;--chip:#EEF0F3;
  --brand:#C92C32;--pri:#1D4ED8;--pri-ink:#fff;--side:#0F1A2B;--side-ink:#C9CDD5;--side-on:#1D4ED8;
  --shadow:0 1px 2px rgba(20,25,35,.05),0 4px 14px rgba(20,25,35,.05);--lw:118px}
@media (prefers-color-scheme:dark){:root{--bg:#0E1118;--card:#171B26;--ink:#E8EAEE;--mut:#9AA1AE;--line:#262C3A;--acc:#5B9BE6;--chip:#202634;--pri:#3B6FF0;--pri-ink:#fff;--side:#0B1424;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body.noscroll{overflow:hidden}
button{font:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:center;gap:10px;min-height:56px}
.hsp{flex:1}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.02em;color:inherit;background:none;border:0;padding:0;white-space:nowrap}
.brand svg{width:28px;height:28px;flex:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;border:0;font-weight:700;font-size:13px;flex:none;display:flex;align-items:center;justify-content:center}
.umenu{position:fixed;top:calc(env(safe-area-inset-top) + 58px);right:12px;z-index:45;width:280px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(20,25,35,.2);padding:8px;animation:fade .12s}
.umenu .uh{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.umenu .uh b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.umenu .mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:9px 10px;border-radius:8px;font-size:14px}
.umenu .mi:hover{background:var(--chip)}
.umenu .mi svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--mut)}
.umenu .ml{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);padding:8px 10px 4px}
.umenu .segc{margin:0 6px 6px}
.umenu-bg{position:fixed;inset:0;z-index:44}
.umenu .uver{border-top:1px solid var(--line);margin-top:6px;padding:8px 10px 2px;font-size:11.5px;color:var(--mut)}
.ptitle{margin:14px 2px 14px}
.ptitle h1{font-size:24px;margin:0;letter-spacing:-.02em;line-height:1.15}
.ptitle p{margin:3px 0 0;color:var(--mut);font-size:13.5px}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 6px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button.on svg{stroke-width:2.2}
nav.tabs svg,.tnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tnav,nav.tabs .sbrand{display:none}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-left:4px solid var(--c)}
.stat b{font-size:28px;display:block;letter-spacing:-.02em;line-height:1.1}
.stat span{color:var(--mut);font-size:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 8px;gap:8px}
.sec h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;user-select:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.segc{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:8px}
.segc button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:13px;color:var(--mut)}
.segc button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--t,var(--c));white-space:nowrap;flex:none}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap}
.row{display:flex;align-items:center;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.li .grow{flex:1;min-width:0}
.pn{font-weight:650}
.mut{color:var(--mut);font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--pri);color:var(--pri-ink);border:0;font-size:30px;line-height:1;box-shadow:0 6px 20px rgba(20,25,35,.3);z-index:25}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=color]{padding:4px;height:44px}
textarea{min-height:84px;resize:vertical}
.field{margin-bottom:12px}
label.l{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.fh{font-size:12px;font-weight:700;margin:20px 0 10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;background:var(--chip);color:var(--ink)}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.danger{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.btn.ghost{background:none;color:var(--acc);padding:8px 4px}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.block{width:100%;margin-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* timeline */
.tl{overflow:auto;max-height:64vh;border-radius:14px;background:var(--card);border:1px solid var(--line);position:relative;overscroll-behavior:contain;box-shadow:var(--shadow)}
.tl-in{position:relative}
.tl-head{position:sticky;top:0;z-index:6;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tl-corner{position:sticky;left:0;z-index:5;width:var(--lw);flex:none;background:var(--card);border-right:1px solid var(--line);padding:10px 12px;display:flex;align-items:flex-start;gap:8px}
.tl-corner .tcn{flex:1;min-width:0}.tl-corner b{font-size:14px;display:block}
.tl-corner .tcl{width:var(--pcw);flex:none}
.tl-years{position:relative;height:40px;flex:none}
.tl-y{position:absolute;top:4px;font-size:12px;font-weight:700}
.tl-q{position:absolute;top:22px;font-size:10px;color:var(--mut)}
.tl-now{position:absolute;top:4px;font-size:10px;font-weight:700;color:#fff;background:var(--brand);border-radius:4px;padding:1px 5px;transform:translateX(-50%);z-index:1}
.tl-row{display:flex;min-height:48px;border-bottom:1px solid var(--line);cursor:pointer}
.tl-row:hover .tl-lab{background:color-mix(in srgb,var(--acc) 4%,var(--card))}
.tl-lab{position:sticky;left:0;z-index:4;width:var(--lw);flex:none;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:-1px;padding:6px 8px;overflow:hidden}
.tl-track{position:relative;flex:none}
.tl-grp{display:flex;min-height:36px;background:var(--chip);border-bottom:1px solid var(--line);cursor:pointer}
.tl-glab{position:sticky;left:0;z-index:4;background:var(--chip);font-size:14px;font-weight:700;color:var(--ink);padding:8px 12px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tl-glab span{color:var(--mut);font-weight:600}
.bar{position:absolute;top:calc(50% - 6px);height:12px;border-radius:6px}
.mk{position:absolute;top:15px;width:12px;height:12px;transform:translateX(-6px) rotate(45deg);border:2px solid var(--card);border-radius:2px;z-index:1}
.nodates{position:absolute;top:calc(50% - 8px);font-size:10px;font-weight:700;line-height:16px;white-space:nowrap;pointer-events:none;filter:brightness(.8)}
.evm{position:absolute;top:calc(50% - 16px);width:28px;height:32px;transform:translateX(-14px);z-index:1;cursor:pointer}
.evm::before{content:"";position:absolute;left:7px;top:9px;width:11px;height:11px;transform:rotate(45deg);background:var(--card);border:3px solid var(--c);border-radius:2px;box-shadow:0 0 0 1.5px var(--card)}
.tl-next{position:absolute;top:calc(50% - 10px);z-index:2;font-size:11px;font-weight:700;color:var(--acc);white-space:nowrap;background:color-mix(in srgb,var(--acc) 12%,var(--card));padding:2px 6px;border-radius:6px}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--brand);opacity:.7;z-index:1;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:12.5px;color:var(--ink);margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow)}
.legend .lg{display:inline-flex;align-items:center;gap:7px}
.legend .lg small{display:block;font-size:10.5px;color:var(--mut);line-height:1.2}
.legend i{display:inline-block;width:26px;height:10px;border-radius:5px;flex:none}
.legend i.dm{width:11px;height:11px;border-radius:2px;transform:rotate(45deg);background:var(--card);border:2.5px solid var(--ink);margin:0 3px}
.legend i.dm.eol{border-color:var(--brand)}.legend i.dm.ev{border-color:#2563eb}
.legend .lsep{width:1px;align-self:stretch;background:var(--line)}
.legend .ztip{color:var(--mut)}
/* legend pinned to the bottom of the screen on the Timeline view */
.legend.lgfix{position:fixed;z-index:26;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));margin:0;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding:8px 14px;gap:8px 16px;scrollbar-width:none;box-shadow:0 6px 24px rgba(20,25,35,.16)}
.legend.lgfix::-webkit-scrollbar{display:none}
.legend.lgfix>*{flex:none}
main:has(.lgfix){padding-bottom:calc(150px + env(safe-area-inset-bottom))}
body:has(.lgfix) .fab{bottom:calc(130px + env(safe-area-inset-bottom))}
body.wide .legend.lgfix{left:24px;right:24px;bottom:14px}
body.wide.navl .legend.lgfix{left:calc(var(--sw) + 24px)}
body.wide main:has(.lgfix){padding-bottom:84px}
body.wide:has(.lgfix) .tl{max-height:calc(100vh - 200px)}
@media (max-width:1099px){body.wide .legend.lgfix{left:16px;right:16px}body.wide.navl .legend.lgfix{left:calc(var(--sw) + 16px)}}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(2,6,23,.45);z-index:40}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sheet.anim{animation:up .24s ease-out}.sheet-bg.anim{animation:fade .2s}
.sheet-h{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line);min-height:56px}
.sheet-h h3{flex:1;margin:0;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-h .bk{margin-left:-8px;padding-left:8px;padding-right:10px}
.sheet-h .shr{display:flex;align-items:center;gap:4px;flex:none}
.xbtn{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.xbtn:hover{background:var(--line);color:var(--ink)}
.sheet-b{overflow-y:auto;padding:16px 16px calc(36px + env(safe-area-inset-bottom));flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (min-width:760px){
  .sheet{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(var(--dw,640px),calc(100vw - 48px));max-height:min(88vh,calc(100vh - 48px));border-radius:16px;border:1px solid var(--line);box-shadow:0 24px 64px rgba(2,6,23,.32);padding-top:0;overflow:hidden}
  .sheet.md{--dw:780px}.sheet.lg{--dw:1080px}
  .sheet.anim{animation:pop .18s ease-out}
  .sheet-b{padding:18px 22px 26px}
  .sheet-h{padding:10px 10px 10px 22px}
}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}}
/* product detail: two columns in the dialog */
.pcols{display:block}
@media (min-width:900px){
  .sheet.lg .pcols{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"a b" "c b";column-gap:22px;align-items:start}
  .pcols .pa{grid-area:a}.pcols .pb{grid-area:b}.pcols .pc{grid-area:c}
}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.hero h2{margin:0 0 2px;font-size:24px;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv span{display:block;font-size:11.5px;color:var(--mut)}
.kv b{font-weight:600;font-size:14px}
.kv small{display:block;font-size:11.5px;color:var(--mut)}
.stepper{display:flex;gap:4px;margin:10px 0 4px}
.stepper i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stepl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut)}
.impact{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.impact:first-child{border-top:0;padding-top:0}
.impact .t{width:92px;flex:none;font-weight:600;font-size:13.5px}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp td,.cmp th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-size:11.5px;color:var(--mut);font-weight:600}
.cmp tr.chg td{background:color-mix(in srgb,var(--warn) 11%,transparent)}
.cmp td:first-child{color:var(--mut);width:28%}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--ok);border-radius:3px}
.ac{display:grid;grid-template-columns:1fr 22px 1fr;gap:6px;align-items:stretch}
.ac .mini{background:var(--chip);border-radius:10px;padding:8px 10px;min-width:0}
.ac .arr{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.empty{text-align:center;color:var(--mut);padding:28px 10px;font-size:14px}
.banner{background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.tag{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--chip);color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .grow{flex:1;min-width:0}
.ev .dt{width:72px;flex:none;font-size:12px;color:var(--mut);text-align:right;padding-top:1px}
.mig{display:flex;align-items:center;gap:8px;margin-top:8px}
.mig select{padding:7px 30px 7px 10px;font-size:14px;width:auto;flex:1}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.center .card{width:100%;max-width:380px}
a{color:var(--acc)}
/* filters, toolbar, zoom */
.fbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fbar input{flex:1;min-width:0}
.ftoggle{flex:none;white-space:nowrap;padding:11px 14px}
.ftoggle.has{background:var(--ink);color:var(--bg)}
.fbody{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px 10px;margin-bottom:12px;box-shadow:var(--shadow)}
.fbody.open{display:block}
.fsum{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);min-height:34px}
.fsec{padding:6px 0 8px;border-top:1px solid var(--line)}
.fsh{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);min-height:28px;margin-bottom:2px}
.fsh .btn{text-transform:none;letter-spacing:0;font-size:12.5px;padding:4px 2px}
.fchip{padding:5px 10px;font-size:12.5px}
.fchip .cnt{font-size:11px;opacity:.55;margin-left:1px}
.fchip.zero{opacity:.42}
.tlbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 8px}
.tlbar .segc{flex:1;min-width:230px;margin:0}
.zoom{display:flex;align-items:center;gap:4px}
.zoom .btn{min-width:38px}
.zl{font-size:12px;min-width:62px;text-align:center}
.tl{touch-action:pan-x pan-y}
.tl-q.qs{color:var(--ink);font-weight:600}
.tl-yl{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
.ztip{margin-left:auto;font-style:italic}
.hov{position:fixed;z-index:35;width:320px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(2,6,23,.22);padding:12px 14px;font-size:13px;pointer-events:none;animation:fade .12s}
.hov.touch{pointer-events:auto}
.hov h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.hov .hs{color:var(--mut);font-size:12px;margin:2px 0 8px}
.hov .hl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:10px 0 4px}
.hov .tr{background:var(--chip);border-radius:10px;padding:8px 10px;margin-top:6px}
.hov .tr b{font-size:14px}
.hov .hx{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--line)}

// Ideas view saved by older versions: 'list' is now the table; status groups are now status tabs
// Compare saved by older versions: one product list per category → one ordered list
{const c=S.cmp;if(!Array.isArray(c.ids)){const o=c.sel&&c.cat&&c.sel[c.cat];c.ids=Array.isArray(o)?o.slice():[]}delete c.sel;delete c.cat;if(!c.sec)c.sec='overview';if(c.saved===undefined)c.saved=null}
if(S.iv.view!=='board')S.iv.view='table';if(!['all','new','eval','approved','roadmap','declined'].includes(S.iv.st))S.iv.st='all';if(!S.iv.dir)S.iv.dir=1;
['cat','lab','prio'].forEach(k=>{if(!Array.isArray(S.iv[k]))S.iv[k]=[]});if(!['updated','new','prio','value','volume','title','cat','status'].includes(S.iv.sort)){S.iv.sort='updated';S.iv.dir=1}delete S.iv.grp;delete S.iv.type;
function saveView(){try{localStorage.setItem('rm_view',JSON.stringify({F:S.F,group:S.f.group,mw:S.mw,sideCol:!!S.sideCol,cmp:S.cmp,rmView:S.rmView,pView:S.pView,det:S.det,hz:S.hz,coll:S.coll,lsort:S.lsort,incOnly:S.incOnly,iv:{...S.iv,q:''},tv:{...S.tv,q:''},lpp:S.lpp,tsort:S.tsort,psort:S.psort,pdir:S.pdir,ppp:S.ppp,tvpp:S.tvpp,g2:1}))}catch(e){}}
TABLES.forEach(t=>S.data[t]=[]);

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const byId=(t,id)=>S.data[t].find(x=>x.id===id);
const today=new Date();today.setHours(0,0,0,0);
const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const rel=m=>iso(new Date(today.getFullYear(),today.getMonth()+m,1));
function d(s){if(!s)return null;const[y,m,dd]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,dd)}
const fmt=s=>s?d(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—';

async function loadAll(){

function clean(row){const o={};for(const[k,v]of Object.entries(row)){if(['created_at','updated_at','updated_by'].includes(k)||v===undefined)continue;o[k]=v===''?null:v}return o}
async function save(table,row){
  row=clean(row);
  if(S.mode==='demo'){
    const L=S.data[table],now=new Date().toISOString();
    if(table==='customer_products'&&L.some(x=>x.id!==row.id&&x.customer_id===row.customer_id&&x.product_id===row.product_id))throw new Error('That customer already has this product.');
    if(row.id){const i=L.findIndex(x=>x.id===row.id);L[i]={...L[i],...row,updated_at:now}}
    else{row.id=uid();row.created_at=row.updated_at=now;L.push(row)}
    Demo.save(S.data);return row;
  }
  const id=row.id;delete row.id;
  const q=id?S.sb.from(table).update(row).eq('id',id).select().single():S.sb.from(table).insert(row).select().single();
  const{data,error}=await q;if(error)throw error;
  const L=S.data[table],i=L.findIndex(x=>x.id===data.id);if(i>=0)L[i]=data;else L.push(data);return data;
}
async function remove(table,id){
  if(S.mode==='demo'){
    if(table==='products'&&S.data.customer_products.some(c=>c.product_id===id))throw new Error('Remove this product from its customers first.');
    if(table==='suppliers'&&S.data.products.some(p=>p.supplier_id===id))throw new Error('This supplier still has products.');
    S.data[table]=S.data[table].filter(x=>x.id!==id);
    if(table==='products'){S.data.transitions=S.data.transitions.filter(t=>t.from_product_id!==id&&t.to_product_id!==id);S.data.events=S.data.events.filter(e=>e.product_id!==id);S.data.part_numbers=S.data.part_numbers.filter(x=>x.product_id!==id);S.data.dev_items=S.data.dev_items.filter(x=>x.product_id!==id)}
    if(table==='suppliers')S.data.events=S.data.events.filter(e=>e.supplier_id!==id);
    if(table==='ideas')IDEA_TABLES.slice(1).forEach(t=>S.data[t]=S.data[t].filter(x=>x.idea_id!==id));
    if(table==='customers')S.data.customer_products=S.data.customer_products.filter(c=>c.customer_id!==id);
    if(table==='transitions')S.data.customer_products.forEach(c=>{if(c.transition_id===id)c.transition_id=null});
    Demo.save(S.data);return;
  }
  const{error}=await S.sb.from(table).delete().eq('id',id);
  if(error){if(error.code==='23503')throw new Error('Still in use elsewhere (e.g. customers or products) — remove those links first.');throw error}
  await loadAll();
}

const DEVK=[{k:'feature',l:'Feature',c:'#2563eb'},{k:'maintenance',l:'Maintenance',c:'#d97706'},{k:'test',l:'Test',c:'#8b5cf6'}];
const DEVS=[{k:'planned',l:'Planned'},{k:'in_progress',l:'In progress'},{k:'done',l:'Done'},{k:'at_risk',l:'At risk'},{k:'cancelled',l:'Cancelled'}];
function gantt(p){
  const items=(S.data.dev_items||[]).filter(x=>x.product_id===p.id&&x.start_date&&x.end_date);
  const add=canEdit()?`<button class="btn ghost sm" data-act="new" data-arg="dev_items" data-def="${esc(JSON.stringify({product_id:p.id}))}">+ Add</button>`:'';
  const head=`<div class="sec"><h2>Product roadmap</h2>${add}</div>`;
  if(!items.length)return head+`<div class="card empty" style="padding:16px">No features, maintenance or test work planned yet.${canEdit()?'<br><span class="mut">Add items like secure boot, a framework update or a validation campaign.</span>':''}</div>`;
  // time window: whole quarters covering the items, today, and at least ~12 months ahead
  const ds=items.flatMap(x=>[d(x.start_date),d(x.end_date)]);
  let a=new Date(Math.min(...ds,+today-60*864e5)),b=new Date(Math.max(...ds,+today+300*864e5));
  a=new Date(a.getFullYear(),Math.floor(a.getMonth()/3)*3,1);b=new Date(b.getFullYear(),Math.floor(b.getMonth()/3)*3+3,1);
  const span=b-a,pct=dt=>Math.max(0,Math.min(100,(dt-a)/span*100));
  const months=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
  let ticks='';for(let m=0;m<months;m+=3){const t=new Date(a.getFullYear(),a.getMonth()+m,1),q=t.getMonth()/3+1;
    // year on its own line (at every Q1 and at the left edge), quarter below it
    ticks+=`<div class="gt${q===1?' gy':''}" style="left:${pct(t)}%">${q===1||m===0?`<span class="gyl">${t.getFullYear()}</span>`:''}${months>36?'':`<span class="gq">Q${q}</span>`}</div>`}
  const marks=[['supplier_release_date','Release'],['nrnd_date','NRND'],['ltb_date','LTB'],['eol_date','EOL']].filter(([k])=>p[k]&&d(p[k])>=a&&d(p[k])<=b)
    .map(([k,l])=>`<div class="gm gm-${k.split('_')[0]}" style="left:${pct(d(p[k]))}%" title="${l} ${fmt(p[k])}"><span>${l}</span></div>`).join('');
  const axisTicks=ticks,lineTicks=ticks.replace(/<span[^>]*>.*?<\/span>/g,'');
  const tx=today>=a&&today<=b?`<div class="gtoday" style="left:${pct(today)}%"></div>`:'';
  let rows='';
  DEVK.forEach(k=>{const L=items.filter(x=>x.kind===k.k).sort((x,y)=>x.start_date.localeCompare(y.start_date));if(!L.length)return;
    rows+=`<div class="grow-h"><span class="dot" style="background:${k.c};width:8px;height:8px"></span> ${k.l} · ${L.length}</div>`;
    L.forEach(x=>{const l=pct(d(x.start_date)),r=pct(d(x.end_date)),w=Math.max(r-l,1.2),st=DEVS.find(s=>s.k===x.status)||DEVS[0];
      rows+=`<div class="grow-r" ${canEdit()?`data-act="edit" data-arg="dev_items" data-id="${x.id}"`:''} title="${esc(x.title)} · ${fmt(x.start_date)} – ${fmt(x.end_date)} · ${st.l}">
        <div class="glab"><b class="ell">${esc(x.title)}</b><span>${fmtMY(x.start_date)} – ${fmtMY(x.end_date)}${x.status!=='planned'?` · <i class="gst gst-${x.status}">${st.l}</i>`:''}</span></div>
        <div class="gtrack"><div class="gbar gb-${x.status}" style="left:${l}%;width:${w}%;--c:${k.c}">${x.status==='done'?'✓':''}</div></div></div>`})});
  const late=['ltb_date','eol_date'].map(f=>p[f]).filter(Boolean).sort()[0];
  const after=late?items.filter(x=>x.kind==='feature'&&x.status!=='cancelled'&&x.end_date>late).length:0;
  return head+`<div class="card gantt">
    <div class="grow-r gaxis"><div class="glab"></div><div class="gtrack">${axisTicks}</div></div>
    <div class="gbody">${rows}<div class="gover"><div class="glab"></div><div class="gtrack">${lineTicks}${tx}${marks}</div></div></div>
    <div class="glegend">${DEVK.map(k=>`<span><i style="background:${k.c}"></i>${k.l}</span>`).join('')}<span><i class="gl-today"></i>Today</span>${marks?'<span><i class="gl-mark"></i>Lifecycle date</span>':''}</div>
    ${after?`<div class="banner" style="margin:10px 0 0">⚠ ${after} feature${after>1?'s finish':' finishes'} after this product's ${p.ltb_date&&p.ltb_date===late?'last-time buy':'end of life'} (${fmtMY(late)}).</div>`:''}</div>`;
}

function tlRow(p,X,W,grid){

  else if(rd)pts.push([rd,od?'evaluating':(RANK[p.lifecycle]>=2?'active':p.lifecycle)]);
  if(od)pts.push([od,'active']);if(nd)pts.push([nd,'nrnd']);if(ld)pts.push([ld,'ltb']);if(ed)pts.push([ed,'end']);

function saveTl(){const t=$('.tl');if(t)S.tlScroll=[S.tlY0*12+t.scrollLeft/S.mw,t.scrollTop]}
function tlYear(){const t=$('.tl'),y=$('.tl-yl');if(!t||!y||S.tlY0==null)return;

/* fit the chosen horizon (e.g. next 12 months, plus a few months of history) to the visible width */
function fitHorizon(){
  const tl=$('.tl'),h=HZ.find(x=>x[0]===S.hz);if(!tl||!h||!S.rows.length)return false;
  const avail=Math.max(120,tl.clientWidth-LW-2),[y0,y1]=tlRange(S.rows);
  const months=h[0]==='all'?(y1-y0+1)*12:+h[0]+h[2];
  S.mw=Math.max(ZMIN,Math.min(ZMAX,avail/months));
  tl.innerHTML=timelineInner(S.rows);
  tl.scrollLeft=h[0]==='all'?0:Math.max(0,((today.getFullYear()-S.tlY0)*12+today.getMonth()-h[2])*S.mw);
  tlYear();return true;
}
function restoreTl(){
  const tl=$('.tl');if(!tl)return;
  if(S.refit||!S.tlScroll){S.refit=false;if(fitHorizon())return;tl.scrollLeft=Math.max(0,S.tlToday-(tl.clientWidth-LW)*0.3)}
  else{tl.scrollLeft=(S.tlScroll[0]-S.tlY0*12)*S.mw;tl.scrollTop=S.tlScroll[1]}
  tlYear();
}
/* zoom, keeping the date under `clientX` fixed on screen */
function setZoom(mw,clientX){hovHide();
  const tl=$('.tl');mw=Math.max(ZMIN,Math.min(ZMAX,mw));
  if(!tl){S.mw=mw;return}
  const r=tl.getBoundingClientRect(),cx=clientX??(r.left+LW+(r.width-LW)/2);
  const xIn=Math.max(LW,cx-r.left),month=(tl.scrollLeft+xIn-LW)/S.mw;
  if(Math.abs(mw-S.mw)<0.05)return;
  S.mw=mw;const st=tl.scrollTop;
  tl.innerHTML=timelineInner(S.rows);
  tl.scrollLeft=month*S.mw-xIn+LW;tl.scrollTop=st;tlYear();
  if(S.hz!=='custom'){S.hz='custom';const h=$('#hz');if(h){h.add(new Option('Custom zoom','custom'));h.value='custom'}}
  clearTimeout(setZoom.t);setZoom.t=setTimeout(saveView,300);
}

/* small lifecycle bar: 4 calendar years, last year to 3 years ahead, with today and the next milestone marked */
// lifecycle segments of one product on any axis X(date) → % (shared by Compare and Transitions)
function lcBars(p,X){
  const ph=phase(p),pts=[],rd=d(p.supplier_release_date),od=d(p.onboard_date),nd=d(p.nrnd_date),ld=d(p.ltb_date),ed=d(p.eol_date);
  if(p.lifecycle==='development'&&rd&&rd>today){pts.push([today,'development']);pts.push([rd,'evaluating'])}
  else if(rd)pts.push([rd,od?'evaluating':(RANK[p.lifecycle]>=2?'active':p.lifecycle)]);
  if(od)pts.push([od,'active']);if(nd)pts.push([nd,'nrnd']);if(ld)pts.push([ld,'ltb']);if(ed)pts.push([ed,'end']);
  pts.sort((a,b)=>a[0]-b[0]);
  if(!pts.length)return`<i class="mseg" style="left:0;width:100%;background:${LC[ph]?.c||'#999'};opacity:.22"></i><span class="mnd">No lifecycle dates</span>`;
  let bars='';
  pts.forEach(([t,k],i)=>{const x0=X(t),x1=k==='end'?100:pts[i+1]?X(pts[i+1][0]):100;if(x1-x0<=0)return;
    const c=k==='end'?LC.eol.c:LC[k]?.c||'#999',plan=['development','evaluating','onboarding'].includes(k);
    bars+=`<i class="mseg" style="left:${x0}%;width:${x1-x0}%;${plan?`background:repeating-linear-gradient(135deg,${c}66 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1.5px ${c}`:k==='end'?`background:${c};opacity:.45`:`background:${c}`}"></i>`});
  return bars;
}
/* small lifecycle bar: 4 calendar years, last year to 3 years ahead, with today, the next milestone and optional extra markers */
function miniTl(p,ex=[]){
  const y0=today.getFullYear()-1,s=new Date(y0,0,1),e=new Date(y0+4,0,1),X=t=>Math.max(0,Math.min(100,(t-s)/(e-s)*100));
  let bars=lcBars(p,X);
  const m=nextMs(p),mk=[];
  if(m)mk.push({date:m.date,c:m.c||LC.active.c,l:m.l});
  ex.forEach(x=>{if(!mk.some(y=>y.date===x.date))mk.push(x)});
  mk.forEach(x=>{const t=d(x.date);if(t>=s&&t<e)bars+=`<i class="mms" style="left:${X(t)}%;--c:${x.c}" title="${esc(x.l)} ${fmt(x.date)}"></i>`});
  bars+=`<i class="mtd" style="left:${X(today)}%" title="Today"></i>`;
  let ax='';for(let y=y0;y<y0+4;y++)ax+=`<span style="left:${X(new Date(y,6,1))}%">${y}</span><i style="left:${X(new Date(y,0,1))}%"></i>`;
  return`<div class="mtl" title="${esc(LC[phase(p)]?.l||'')}"><div class="mtr">${bars}</div><div class="mtx">${ax}<i style="left:100%"></i></div></div>`;
}

const yes='<span class="cy">✓</span>',no='<span class="cn">—</span>';
const emptyV=v=>v==null||v===''||v===false;
/* decide which rows show and what each cell holds; used by the table and by the CSV export */
function cmpModel(cols){
  const same=new Set(cols.map(p=>p.category)).size===1,gapsOn=same&&S.cmp.gaps!==false&&cols.length>0,multi=cols.length>1;
  const out=[];let secOpen=null,subOpen=null;
  cmpRows(cols).forEach(r=>{
    if(r.sec){secOpen=r;subOpen=null;return}
    if(r.sub){subOpen=r;return}
    let cells,gap=false;
    if(r.tl)cells=cols.map(p=>({h:miniTl(p),t:''}));
    else{
      const raw=cols.map(p=>r.get(p)),na=cols.map((p,i)=>!!r.ap&&!r.ap(p)&&emptyV(raw[i]));
      if(na.every(Boolean))return;
      if(r.bool){
        const n=raw.filter((v,i)=>v&&!na[i]).length;
        if(n===0){if(!gapsOn||r.noGap)return;gap=true}
      }else if(raw.every((v,i)=>na[i]||emptyV(v)))return;
      const key=raw.map((v,i)=>na[i]?'n/a':r.bool?(v?'yes':'no'):String(v??''));
      if(S.cmp.diff&&multi&&key.every(k=>k===key[0]))return;
      let best=null;
      if(r.best&&same){const nums=raw.filter((v,i)=>!na[i]&&typeof v==='number');if(nums.length>1){const b=r.best==='max'?Math.max(...nums):Math.min(...nums);if(nums.some(v=>v!==b))best=b}}
      cells=cols.map((p,i)=>{
        if(na[i])return{h:'<span class="na">n/a</span>',t:'n/a',cls:'cna'};
        const v=raw[i];
        if(r.bool)return{h:v?yes:no,t:v?'Yes':'No',cls:'c'};
        const h=emptyV(v)?'':(r.html?r.html(p):esc(v));
        return{h:h||'<span class="cn">—</span>',t:emptyV(v)?'':String(v)+(r.label==='Margin'?'%':''),cls:best!=null&&v===best?'best':''}});
    }
    if(secOpen){out.push({sec:secOpen.sec,t:secOpen.t});secOpen=null}
    if(subOpen){out.push({sub:subOpen.sub});subOpen=null}
    out.push({label:r.label,cells,gap,tl:!!r.tl});
  });
  return{rows:out,same};
}

function cmpHealth(p){

function cmpRisks(p){

function valueChart(cols){
  const M={io:['Total I/O',p=>totalIO(p)],feat:['Interfaces + protocols + I/O types',p=>(p.interfaces||[]).length+(p.can_protocols||[]).length+(p.io_types||[]).length],can:['CAN ports',p=>p.can_ports]};

  const ctl=`<div class="row" style="gap:8px;flex-wrap:wrap"><div class="segc" style="margin:0">${Object.entries(PB).map(([k,[l]])=>`<button class="${(S.cmp.priceBy||'list')===k?'on':''}" data-act="cmpprice" data-arg="${k}">${l}</button>`).join('')}</div>

  if(pts.length<2){svg=`<div class="empty" style="padding:22px">Add ${pl.toLowerCase()} and ${ml.toLowerCase()} to at least two of these products to see value vs capability.<br><span class="mut">${missing} of ${cols.length} have no ${pl.toLowerCase()} yet — open a product → Edit → Pricing.</span></div>`}
  else{
    const W=640,H=300,L=56,B=40,T=16,Rr=16,xs=pts.map(o=>+o.x),ys=pts.map(o=>+o.y);
    const nice=m=>{const raw=Math.max(m,1)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].find(k=>k*mag>=raw)*mag;return[st,Math.ceil(m*1.05/st)*st||st]};
    const [xs_,x1]=nice(Math.max(...xs)),[ys_,y1]=nice(Math.max(...ys)),x0=0,y0=0;
    const X=v=>L+(v-x0)/(x1-x0)*(W-L-Rr),Y=v=>H-B-(v-y0)/(y1-y0)*(H-B-T);

const TV_TYPE=[['replace','Replace','<path d="m5 7 5 5-5 5M12 7l5 5-5 5"/>','#2563EB'],['migrate','Migrate','<path d="M4 12h13M13 7l5 5-5 5"/><path d="M4 7v10"/>','#93C5FD'],

  ['planned','Planned',I.cal,'#2563EB'],['phasing','Phasing out',I.glass,'#F59E0B','#B45309'],['complete','Complete',I.check,'#16a34a','#15803d']];
const TV_STM=Object.fromEntries(TV_ST.map(([k,l,i,c,t])=>[k,{l,i,c,t}]));
const tvChip=(m,cls='')=>`<span class="badge ib ${cls}" style="--c:${m.c}${m.t?';--t:'+m.t:''}">${ic(m.i)}${m.l}</span>`;
const tvTypeOf=t=>!t?'phaseout':/software platform/i.test(t.transition_type||'')?'migrate':/family expansion/i.test(t.transition_type||'')?'extend':'replace';
const DONE_MIG=['released','complete'];
// all rows, with derived fields
function tvItems(){
  const out=[];
  S.data.transitions.forEach(t=>{const a=byId('products',t.from_product_id),b=byId('products',t.to_product_id);if(a&&b)out.push(tvItem(a,b,t))});
  S.data.products.filter(p=>['nrnd','ltb','eol'].includes(phase(p))&&!S.data.transitions.some(t=>t.from_product_id===p.id)).forEach(p=>out.push(tvItem(p,null,null)));
  return out;
}
function tvItem(a,b,t){
  const cps=t?cpsFor(t):S.data.customer_products.filter(c=>c.product_id===a.id);
  const done=cps.filter(c=>DONE_MIG.includes(c.transition_status)).length,risk=cps.filter(c=>c.transition_status==='at_risk').length,
    started=cps.filter(c=>!DONE_MIG.includes(c.transition_status)&&c.transition_status!=='not_started').length,notSt=cps.filter(c=>c.transition_status==='not_started').length;
  const ph=phase(a),ltb=a.ltb_date||t?.ltb_date||null,ltbDays=ltb?daysUntil(ltb):null,phasing=['nrnd','ltb','eol'].includes(ph);
  let st;
  if(ph==='eol'&&done===cps.length)st='complete';
  else if(risk||(ltbDays!=null&&ltbDays>=0&&ltbDays<=90&&notSt))st='at_risk';
  else if(!b)st='phasing';
  else if(started||(done&&done<cps.length))st='in_progress';
  else if(!phasing)st='planned';
  else st=cps.length?'not_started':'in_progress';
  const tgt=cps.map(c=>c.target_date).filter(Boolean).sort().pop()||null;
  return{id:t?t.id:'p:'+a.id,t,a,b,cps,done,risk,st,type:tvTypeOf(t),ltb,tgt,phasing};
}

/* ---- customer opportunities: the idea's own sizing + every added opportunity, one entry per customer ---- */
function sizingRev(x,price){
  if(!x||!x.size_basis||x.size_basis==='unknown')return null;
  const mid=(RANGES[x.size_basis].find(r=>r[0]===x.size_range)||[])[1],v=x.size_exact!=null&&x.size_exact!==''?+x.size_exact:mid;

}
function ideaValue(i){

  const price=isContrib()?null:(links.map(l=>byId('products',l.target_id)?.list_price).find(v=>v!=null)??null);
  const key=x=>x.customer_id||(x.customer_name||'').trim().toLowerCase()||('by:'+(x.voter||x.submitted_by));
  const by=new Map(),fam=[i,...(S.data.ideas||[]).filter(x=>x.duplicate_of===i.id&&x.status==='duplicate')],ids=new Set(fam.map(x=>x.id));
  const V=(S.data.idea_votes||[]).filter(v=>ids.has(v.idea_id));
  [...fam.slice(1),i,...V].forEach(x=>{if(x.size_basis&&x.size_basis!=='unknown')by.set(key(x),x)});
  let rev=0,units=0,w=0,firm=0,hasRev=false,hasUnits=false,uOnly=0;
  by.forEach(x=>{const s=sizingRev(x,price);if(!s)return;
    if(s.units!=null){units+=s.units;hasUnits=true;if(s.rev==null)uOnly+=s.units}
    if(s.rev!=null){rev+=s.rev;w+=s.rev*(CONFW[x.confidence]??0.25);hasRev=true}
    if(x.confidence==='firm')firm++});
  const votes=V.length+fam.length-1;
  const customers=new Set([...fam,...V].filter(x=>x.customer_id||x.customer_name||(x.size_basis&&x.size_basis!=='unknown')).map(key)).size;
  const years=i.program_years||5;
  return{uOnly,rev:hasRev?rev:null,units:hasUnits?units:null,weighted:hasRev?w:null,lifetime:hasRev?rev*years:null,firm,customers,votes,sized:by.size>0,years};

/* ---- filters (S.iv: q, st = status group, cat, lab, prio, mine, waiting) ---- */
function ideaMatches(i,ex){
  const q=S.iv.q.trim().toLowerCase();
  if(q){const prods=(S.data.idea_links||[]).filter(l=>l.idea_id===i.id&&l.kind==='product').map(l=>prodById(l.target_id)?.part_number||'').join(' ');
    if(![i.title,i.problem,i.proposed_solution,i.customer_name,custName(i.customer_id),i.submitted_by,prods,ICM[catOf(i)]?.l,labelsOf(i).map(l=>ILM[l]).join(' ')].join(' ').toLowerCase().includes(q))return false}
  if(ex!=='cat'&&S.iv.cat.length&&!S.iv.cat.includes(catOf(i)||'none'))return false;
  if(ex!=='lab'&&S.iv.lab.length&&!labelsOf(i).some(l=>S.iv.lab.includes(l)))return false;
  if(ex!=='prio'&&S.iv.prio.length&&!isContrib()&&!S.iv.prio.includes(i.pm_priority||'none'))return false;
  if(S.iv.mine&&i.submitted_by!==me()&&!(S.data.idea_votes||[]).some(v=>v.idea_id===i.id&&v.voter===me()))return false;
  if(S.iv.waiting){if(canEdit()){if(!['new','under_review'].includes(i.status))return false}else if(!(i.submitted_by===me()&&i.status==='needs_info'))return false}
  return true;
}
function ideaSort(L){
  // dir 1 = the natural order for that column (newest first, A–Z, highest priority…); -1 reverses it
  const k=S.iv.sort,dir=S.iv.dir||1,val=new Map(L.map(i=>[i.id,ideaValue(i)]));
  const pr={critical:0,high:1,medium:2,low:3},go=Object.fromEntries(ISG.map((g,n)=>[g.k,n]));
  const newest=(a,b)=>String(b.created_at).localeCompare(String(a.created_at));
  const C={
    value:(a,b)=>{const pa=pr[a.pm_priority]??9,pb=pr[b.pm_priority]??9;if(pa!==pb)return pa-pb;   // PM priority first
      const va=val.get(a.id),vb=val.get(b.id);return(vb.weighted??-1)-(va.weighted??-1)||(vb.units??-1)-(va.units??-1)||(a.need_by||'9999').localeCompare(b.need_by||'9999')},
    volume:(a,b)=>{const va=val.get(a.id),vb=val.get(b.id);return(vb.units??-1)-(va.units??-1)||(vb.rev??-1)-(va.rev??-1)},
    new:newest,
    updated:(a,b)=>String(b.updated_at||b.created_at).localeCompare(String(a.updated_at||a.created_at)),
    title:(a,b)=>String(a.title).localeCompare(String(b.title)),
    cat:(a,b)=>(ICM[catOf(a)]?.l||'~').localeCompare(ICM[catOf(b)]?.l||'~'),
    prio:(a,b)=>(pr[a.pm_priority]??9)-(pr[b.pm_priority]??9),
    status:(a,b)=>go[sgOf(a.status).k]-go[sgOf(b.status).k]}[k]||newest;
  return L.sort((a,b)=>C(a,b)*dir||newest(a,b));

/* ---- small data helpers for idea child rows ---- */
async function delRow(table,id){
  if(S.mode==='demo'){S.data[table]=S.data[table].filter(x=>x.id!==id);Demo.save(S.data);return}
  const{error}=await S.sb.from(table).delete().eq('id',id);if(error)throw error;
  S.data[table]=S.data[table].filter(x=>x.id!==id);
}
const vkey=x=>x.customer_id||(x.customer_name||'').trim().toLowerCase()||('by:'+(x.voter||me()));
function onStatusPick(id,to){
  const i=ideaById(id);if(!i||i.status===to||sgOf(i.status)===sgOf(to))return;
  if(['needs_info','declined','duplicate','parked'].includes(to))return push({type:'ideastatus',id,to});
  setStatus(id,to).then(()=>{toast('Moved to '+ISM[to].l);rerenderIdeas()}).catch(err=>toast(errMsg(err)));
}

/* ---- form controls ---- */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.type==='radio'&&t.closest('label.rchip')){
    t.form?.querySelectorAll(`input[name="${t.name}"]`).forEach(r=>r.closest('label.rchip')?.classList.toggle('on',r.checked));
    if(t.name==='category'){const lb=t.form?.querySelector('.ilabs');if(lb)lb.hidden=t.value!=='product'}
    if(t.name==='size_basis'){const box=t.closest('.sizing');box.querySelectorAll('.szr').forEach(z=>z.hidden=!z.dataset.for.split(' ').includes(t.value))}
    return}
  if(t.dataset.pick==='prod'){const v=t.value;t.value='';if(!v)return;const box=t.closest('.picker').querySelector('.pchips');
    if(box.querySelector(`input[value="${v}"]`))return;const p=prodById(v);
    box.insertAdjacentHTML('beforeend',`<span class="chip on">${esc(p.part_number)}<input type="hidden" name="prod" value="${v}"><button type="button" class="x" data-act="pickrm">✕</button></span>`);return}
  if(t.hasAttribute('data-cust')){const o=t.parentNode.querySelector('.custother');if(o){o.hidden=t.value!=='__other';if(!o.hidden)o.focus()}return}
  if(t.id==='isort'){S.iv.sort=t.value;S.iv.dir=1;refreshIdeas();return}
  if(t.dataset.istatus){const id=t.dataset.istatus,to=t.value;t.value=sgOf(ideaById(id).status).to;onStatusPick(id,to);return}
});
document.addEventListener('input',e=>{if(e.target.id==='iq'){S.iv.q=e.target.value;clearTimeout(refreshIdeas.t);refreshIdeas.t=setTimeout(refreshIdeas,120)}});

/* ---- idea form submissions ---- */
document.addEventListener('submit',async e=>{
  const f=e.target;if(!/^idea/.test(f.id))return;e.preventDefault();
  const top=S.stack[S.stack.length-1],fd=new FormData(f),err=f.querySelector('#ierr'),btn=f.querySelector('button.pri:not([type=button])');
  const fail=m=>{if(err)err.textContent=m;else toast(m)};
  const busy=b=>{if(btn)btn.disabled=b};
  try{
  if(f.id==='ideafrm'){
    const cat=fd.get('category');if(!cat)return fail('Pick a category.');const labels=cat==='product'?fd.getAll('labels'):[];
    const sz=readSizing(f);if(sz.err)return fail(sz.err);
    const nb=fd.get('need_by');if(nb&&!/^\d{4}-\d{2}/.test(nb))return fail('Needed by: use YYYY-MM.');
    const o={title:fd.get('title').trim(),problem:fd.get('problem').trim(),idea_type:typeFor(cat,labels),category:cat,labels,...sz,...readCustomer(f),
      need_by:nb?nb.slice(0,7)+'-01':null,proposed_solution:(fd.get('proposed_solution')||'').trim()||null,market:fd.get('market')||null,program_years:+fd.get('program_years')||5};
    if(top.id)o.id=top.id;busy(true);
    let out;try{out=await ideaSave('ideas',o,top.id?['edit',{}]:['created',{title:o.title}])}
    catch(x){if(!/category|labels/i.test(x?.message||''))throw x;delete o.category;delete o.labels;   // database without 08_idea_category.sql
      out=await ideaSave('ideas',o,top.id?['edit',{}]:['created',{title:o.title}]);setTimeout(()=>toast('Saved without the category: run 08_idea_category.sql to store categories.'),300)}
    const want=[...new Set(fd.getAll('prod'))],have=(S.data.idea_links||[]).filter(l=>l.idea_id===out.id&&l.kind==='product');
    for(const pid of want.filter(x=>!have.some(l=>l.target_id===x)))await ideaSave('idea_links',{idea_id:out.id,kind:'product',target_id:pid},['link',{kind:'product'}]);
    for(const l of have.filter(l=>!want.includes(l.target_id)))await delRow('idea_links',l.id).catch(()=>{});
    S.stack.pop();
    if(top.id)toast('Saved');else{toast('Idea submitted — thanks!');S.stack.push({type:'idea',id:out.id})}
    return rerenderIdeas();
  }
  if(f.id==='ideavotefrm'){

function upcomingFor(p,n){
  const out=[];
  [['supplier_release_date','Supplier release'],['sample_date','Samples'],['onboard_date','Onboarding'],['nrnd_date','NRND'],['ltb_date','Last-time buy'],['last_ship_date','Last ship'],['eol_date','End of life'],['end_of_support_date','End of support']]
    .forEach(([k,l])=>{if(p[k]&&d(p[k])>=today)out.push({date:p[k],l,kind:'date'})});
  S.data.events.forEach(e=>{if(e.product_id===p.id&&e.event_date&&d(e.event_date)>=today)out.push({date:e.event_date,l:e.title,kind:e.kind})});
  return out.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,n);
}

    out.forEach(t=>{const b=byId('products',t.to_product_id);if(!b)return;const cps=cpsFor(t),done=cps.filter(c=>['released','complete'].includes(c.transition_status)).length,risk=cps.filter(c=>c.transition_status==='at_risk').length;
      h+=`<div class="tr"><div>→ <b>${esc(b.part_number)}</b> ${badge(phase(b))}</div>

const HOV={el:null,key:null,timer:0,touch:false};
function hovShow(row,evEl,x,y,touch){
  const p=byId('products',row.dataset.id);if(!p)return;
  const ev=evEl?byId('events',evEl.dataset.id):null,key=p.id+'|'+(ev?.id||'')+'|'+touch;
  if(!HOV.el){HOV.el=document.createElement('div');document.body.appendChild(HOV.el)}
  if(HOV.key!==key){HOV.el.className='hov'+(touch?' touch':'');HOV.el.innerHTML=hovCard(p,ev,touch);HOV.key=key}
  HOV.el.style.display='block';HOV.touch=touch;hovMove(x,y);
}
function hovMove(x,y){
  const el=HOV.el;if(!el||el.style.display==='none')return;
  const w=el.offsetWidth,h=el.offsetHeight,vv=window.visualViewport,vw=vv?vv.width:document.documentElement.clientWidth,vh=vv?vv.height:innerHeight,pad=12;
  let left=HOV.touch?(vw-w)/2:x+18,top=HOV.touch?y-h-24:y+18;
  if(!HOV.touch){if(left+w>vw-pad)left=x-w-18;if(top+h>vh-pad)top=y-h-18}
  else if(top<pad)top=Math.min(y+28,vh-h-pad);
  el.style.left=Math.max(pad,Math.min(left,vw-w-pad))+'px';el.style.top=Math.max(pad,top)+'px';
}
function hovHide(){clearTimeout(HOV.timer);if(HOV.el)HOV.el.style.display='none';HOV.key=null}
// desktop: hover
document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  const row=e.target.closest&&e.target.closest('.tl-row');
  if(!row||S.stack.length){if(!HOV.touch)hovHide();return}
  const evEl=e.target.closest('.evm'),key=row.dataset.id+'|'+(evEl?.dataset.id||'')+'|false';
  if(HOV.el&&HOV.el.style.display==='block'&&HOV.key===key)return hovMove(e.clientX,e.clientY);
  clearTimeout(HOV.timer);const x=e.clientX,y=e.clientY;
  if(HOV.el&&HOV.el.style.display==='block')hovShow(row,evEl,x,y,false);   // already showing: switch instantly
  else HOV.timer=setTimeout(()=>hovShow(row,evEl,x,y,false),220);
});
document.documentElement.addEventListener('mouseleave',()=>{if(!HOV.touch)hovHide()});
document.addEventListener('scroll',()=>{if(!HOV.touch)hovHide()},true);
// phone: long-press (~0.45 s, finger held still)
(function(){
  let t=0,sx=0,sy=0,fired=0;
  document.addEventListener('touchstart',e=>{
    if(HOV.touch&&HOV.el&&!HOV.el.contains(e.target))hovHide(),HOV.touch=false;
    if(e.touches.length!==1)return clearTimeout(t);
    const row=e.target.closest&&e.target.closest('.tl-row');if(!row)return;
    const evEl=e.target.closest('.evm');sx=e.touches[0].clientX;sy=e.touches[0].clientY;
    clearTimeout(t);t=setTimeout(()=>{fired=Date.now();navigator.vibrate?.(10);hovShow(row,evEl,sx,sy,true)},450);
  },{passive:true});
  document.addEventListener('touchmove',e=>{if(Math.hypot(e.touches[0].clientX-sx,e.touches[0].clientY-sy)>10)clearTimeout(t)},{passive:true});
  document.addEventListener('touchend',()=>clearTimeout(t));
  document.addEventListener('touchcancel',()=>clearTimeout(t));
  // the finger lifting after a long-press must not also "tap" the row
  document.addEventListener('click',e=>{if(Date.now()-fired<700&&e.target.closest('.tl')){e.stopPropagation();e.preventDefault()}},true);
  document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.tl'))e.preventDefault()});
})();

/* ---------- zoom gestures ---------- */
const inTl=t=>t&&t.closest&&t.closest('.tl');
// iPhone / Android: two-finger pinch on the timeline
(function(){
  let pz=null,raf=0,pending=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const mid=t=>(t[0].clientX+t[1].clientX)/2;
  function move(e){if(!pz||e.touches.length<2)return;e.preventDefault();
    pending=[pz.mw*dist(e.touches)/pz.d,mid(e.touches)];
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(pending)setZoom(pending[0],pending[1])})}
  function end(e){if(pz&&e.touches.length<2){pz.els.forEach(el=>{el.removeEventListener('touchmove',move);el.removeEventListener('touchend',end);el.removeEventListener('touchcancel',end)});pz=null;saveView()}}
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==2||!inTl(e.touches[0].target))return;
    e.preventDefault();
    // listen on the touched elements too: they get re-rendered (detached) while zooming
    const els=[...new Set([e.touches[0].target,e.touches[1].target,document])];
    pz={d:dist(e.touches),mw:S.mw,els};
    els.forEach(el=>{el.addEventListener('touchmove',move,{passive:false});el.addEventListener('touchend',end);el.addEventListener('touchcancel',end)});
  },{passive:false});
  // stop iOS Safari zooming the whole page when pinching the timeline
  ['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>{if(pz||inTl(e.target))e.preventDefault()},{passive:false}));
})();
// Desktop: Ctrl/⌘ + wheel, and trackpad pinch (sent as ctrl+wheel by Chrome/Edge/Firefox)
document.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey)||!inTl(e.target))return;e.preventDefault();setZoom(S.mw*Math.exp(-Math.max(-50,Math.min(50,e.deltaY))*0.006),e.clientX)},{passive:false});
// Safari on Mac: trackpad pinch arrives as gesture events
if(!('ontouchstart' in window)){let g0=null;
  document.addEventListener('gesturestart',e=>{if(inTl(e.target)){e.preventDefault();g0=S.mw}},{passive:false});
  document.addEventListener('gesturechange',e=>{if(g0!=null){e.preventDefault();setZoom(g0*e.scale,e.clientX)}},{passive:false});
  document.addEventListener('gestureend',()=>{g0=null});}
// re-layout when the window crosses the phone/desktop breakpoint or rotates
let _wasWide=wide()+'|'+(innerWidth>=1100)+'|'+(innerWidth>=1300);
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{const k=wide()+'|'+(innerWidth>=1100)+'|'+(innerWidth>=1300);if(k!==_wasWide&&$('#main')){_wasWide=k;saveTl();renderAll()}},150)});

/* renaming a market also relabels the products and customers tagged with it */
async function renameMarket(from,to){
  for(const p of S.data.products.filter(p=>(p.markets||[]).includes(from)))
    await save('products',{id:p.id,markets:[...new Set(p.markets.map(m=>m===from?to:m))]});
  for(const c of S.data.customers.filter(c=>c.market===from))
    await save('customers',{id:c.id,market:to});
}

  const bySup={};ps.forEach(p=>{bySup[p.supplier_id]=(bySup[p.supplier_id]||0)+1});
  const top=Math.max(...Object.values(bySup)),topS=Object.keys(bySup).find(k=>bySup[k]===top),share=top/n;
  const mk=S.data.markets.filter(m=>m.status!=='considering').map(m=>m.name);

  const parts=[

    {l:'Not at risk',v:pc(1-risk.size/n),d:`${risk.size} product${risk.size===1?' is':'s are'} at risk`},
    {l:'Phase-out coverage',v:out.length?pc(cov/out.length):100,d:out.length?`${cov} of ${out.length} phasing-out products have a successor`:'No products are phasing out'},
    {l:'Supplier spread',v:share<=.5?100:pc((1-share)/.5),d:`Largest supplier: ${byId('suppliers',topS)?.name||'—'}, ${pc(share)}% of products`},
    {l:'Market coverage',v:mk.length?pc(mOk.length/mk.length):100,d:mk.length?`${mOk.length} of ${mk.length} active markets have 3 or more Active products`:'No active markets set'}];

}

  const bulk=sel.size?`<div class="bulk"><b>${sel.size} selected</b><button class="btn sm" data-act="tvbcsv">${ic(I.dl)} Export CSV</button>${canEdit()?`<button class="btn sm" data-act="tvbown">${ic(CXI.sup)} Set owner</button>`:''}<button class="btn ghost sm" data-act="tvbclr">Clear selection</button></div>`:'';
  return tvPills()+bulk+(wide()?tvTable(page):`<div class="tvcards">${page.map(tvCard).join('')}</div>`)+pager2(L.length,pp,S.tvpg,'tvpg','tvpp','transition',[10,25,50,0]);
}

document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='psort'){S.psort=t.value;S.pdir=1;S.ppg=0;refreshResults();return}
  if(t.id==='ppp'){S.ppp=+t.value;S.ppg=0;refreshResults();return}
  if(t.id==='tvsort'){S.tv.sort=t.value;S.tvpg=0;tvRefresh();return}
  if(t.id==='tvpp'){S.tvpp=+t.value;S.tvpg=0;tvRefresh();return}
  const c=t.dataset?.change;if(!c)return;
  if(c==='psel'){const s=S.psel;t.checked?s.add(t.dataset.id):s.delete(t.dataset.id);refreshResults();return}
  if(c==='pselall'){const ids=[...document.querySelectorAll('.ptab2 tbody .rck')].map(x=>x.dataset.id);ids.forEach(id=>t.checked?S.psel.add(id):S.psel.delete(id));refreshResults();return}
  if(c==='tvsel'){const s=S.tvsel;t.checked?s.add(t.dataset.id):s.delete(t.dataset.id);tvRefresh();return}
  if(c==='tvselall'){const ids=[...document.querySelectorAll('.tvt2 tbody .rck')].map(x=>x.dataset.id);ids.forEach(id=>t.checked?S.tvsel.add(id):S.tvsel.delete(id));tvRefresh();return}

function rmSwitch(){

}
function pager(n,pp,pages){
  if(!n)return'';const pg=S.lpage||0,a=pg*pp+1,b=Math.min(n,pg*pp+pp);
  let nums=[];if(pages<=7)nums=[...Array(pages).keys()];else{nums=[0];const lo=Math.max(1,pg-1),hi=Math.min(pages-2,pg+1);if(lo>1)nums.push('…');for(let i=lo;i<=hi;i++)nums.push(i);if(hi<pages-2)nums.push('…');nums.push(pages-1)}
  const btn=(i)=>i==='…'?'<span class="pgd">…</span>':`<button class="pgb ${i===pg?'on':''}" data-act="lpg" data-arg="${i}">${i+1}</button>`;
  return`<div class="pager"><span class="mut">Showing ${a}–${b} of ${n} products</span><span class="hsp"></span>
    <label class="sel">Rows per page <select id="lpp">${[25,50,100,0].map(v=>`<option value="${v}" ${S.lpp===v?'selected':''}>${v||'All'}</option>`).join('')}</select></label>
    ${pages>1?`<span class="pgs"><button class="pgb" data-act="lpg" data-arg="${pg-1}" ${pg?'':'disabled'} aria-label="Previous page">‹</button>${nums.map(btn).join('')}<button class="pgb" data-act="lpg" data-arg="${pg+1}" ${pg<pages-1?'':'disabled'} aria-label="Next page">›</button></span>`:''}</div>`;
}

}

// photo upload: shrink to fit 100 × 100 px, keep the aspect ratio, store as a small data URL
async function phLoad(file){
  const box=$('#frm [name=photo]');if(!box)return;
  if(!/^image\//.test(file.type))return toast('Choose an image file.');
  try{
    const url=URL.createObjectURL(file),img=new Image();img.src=url;await img.decode();URL.revokeObjectURL(url);
    const k=Math.min(1,100/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(img,0,0,w,h);
    let out=cv.toDataURL('image/webp',.85);
    if(!out.startsWith('data:image/webp'))out=cv.toDataURL('image/png');
    if(out.length>40000){g.globalCompositeOperation='destination-over';g.fillStyle='#fff';g.fillRect(0,0,w,h);out=cv.toDataURL('image/jpeg',.85)}
    if(!PHOTO_RE.test(out)||out.length>60000)return toast('That image could not be shrunk enough. Try another one.');
    box.value=out;const cat=$('#frm [name=category]')?.value||'other';
    $('#phprev').innerHTML=catIc({category:cat,photo:out,part_number:''},'lg');$('#frm [data-act=phclr]')?.removeAttribute('hidden');
    toast(`Photo ready (${w} × ${h} px) — save to keep it`);
  }catch(e){toast('Could not read that image.')}
}
